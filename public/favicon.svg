<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="kyp-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="kyp-stroke" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- Page-bg base so the gradient reads correctly on light tab strips -->
  <rect width="32" height="32" rx="7" fill="#020617"/>
  <!-- Brand square -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="url(#kyp-bg)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" fill="none" stroke="url(#kyp-stroke)" stroke-width="1"/>
  <!-- KYP wordmark -->
  <text
    x="16"
    y="21.5"
    font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="11.5"
    fill="#dbeafe"
    text-anchor="middle"
    letter-spacing="-0.6"
  >KYP</text>
</svg>
